name: Android audio processors

on:
  pull_request:
    paths:
      - 'packages/just_audio/**'
      - 'lib/services/audio/**'
      - 'lib/services/settings_service.dart'
      - 'lib/widgets/speed_sheet.dart'
      - 'lib/main.dart'
      - 'test/android_speed_processing_test.dart'
      - 'test/speed_controls_test.dart'
      - 'lib/services/native_licenses.dart'
      - 'assets/licenses/ANDROID-NDK.txt'
      - 'scripts/audit_android_audio.py'
      - 'scripts/tests/test_android_audio_audit.py'
      - 'licensing/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check APK, ELF, DEX and notice audit failure cases
        run: python3 -m unittest discover -s scripts/tests -p test_android_audio_audit.py -v
      - name: Verify pinned sources and compile the actual processors
        run: python3 packages/just_audio/native/crisper_dsp/tools/build_host.py --jobs 2
      - name: Check PCM timing, pitch, short clips, backpressure and resets
        run: >-
          python3 packages/just_audio/native/crisper_dsp/tools/test_streaming.py
          --library build/native-dsp/libcrisper_dsp.so
          --report build/native-dsp/test-report.json
      - name: Compare the WSOLA fork with unchanged Chromium helpers
        run: python3 packages/just_audio/native/crisper_dsp/tools/test_wsola_reference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-audio-processor-evidence
          path: build/native-dsp/*report.json
          if-no-files-found: warn

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Rust targets for the bundled SMB bridge
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - uses: android-actions/setup-android@v3
        with:
          # The legacy SDK package named "tools" is no longer published.
          packages: 'platform-tools'
      - name: Install the pinned native toolchain
        run: sdkmanager 'cmake;3.22.1' 'ndk;28.2.13676358'
      - run: flutter pub get
      - name: Check processor settings and native configuration transport
        run: flutter test --no-pub test/android_speed_processing_test.dart test/speed_controls_test.dart
      # Source evidence refers to the checked-in explanatory notice asset.
      # Preserve it before replacing the asset with the exact installed notices.
      - name: Record Android source and license evidence before preparing notices
        run: >-
          python3 scripts/check_distribution_licenses.py --report --platform android
          --output build/android-audio-evidence/source-license-report.json
      - name: Prepare exact installed-NDK notices for Flutter assets
        run: >-
          python3 scripts/audit_android_audio.py prepare-notices
          --ndk "$ANDROID_HOME/ndk/28.2.13676358"
          --output build/android-audio-evidence/ndk-notices.json
      - name: Compile arm64 and x86-64 debug integration
        # Flutter 3.44's --no-pub also skips mode-specific plugin registrant
        # generation. Let each build regenerate its own debug/release list.
        run: flutter build apk --debug --target-platform android-arm64,android-x64
      - name: Compile R8 release integration with the local debug key
        # No release signing secrets are supplied. The app's Gradle configuration
        # uses its local debug key while still running R8 and resource shrinking.
        run: |
          flutter build apk --release --target-platform android-arm64,android-x64
          python3 - <<'PY'
          from pathlib import Path
          registrant = Path('android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java').read_text()
          if 'dev.flutter.plugins.integration_test.IntegrationTestPlugin' in registrant:
              raise SystemExit('Release registrant still includes the development-only integration_test plugin')
          PY
      - name: Inspect the final debug and release APK payloads
        env:
          AUDIT_SOURCE_REVISION: ${{ github.sha }}
        run: |
          audit_status=0
          for mode in debug release; do
            python3 scripts/audit_android_audio.py inspect \
              "build/app/outputs/flutter-apk/app-$mode.apk" \
              --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
              --abi arm64-v8a --abi x86_64 \
              --source-revision "$AUDIT_SOURCE_REVISION" \
              --output "build/android-audio-evidence/$mode-apk.json" || audit_status=1
          done
          exit "$audit_status"
      - name: Check the Media3 processor lifecycle
        working-directory: android
        run: ./gradlew :just_audio:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the actual JNI processors on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew :just_audio:connectedDebugAndroidTest -Ptarget-platform=android-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-audio-processor-evidence
          path: |
            build/android-audio-evidence/
            build/app/outputs/mapping/release/
            build/just_audio/reports/
            build/just_audio/outputs/androidTest-results/
            build/just_audio/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-audio-inspected-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
