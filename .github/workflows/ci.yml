name: CI
on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Check release automation
        run: |
          python3 -m venv "$RUNNER_TEMP/release-checks"
          "$RUNNER_TEMP/release-checks/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/release-checks/bin/python" -m unittest discover -s scripts/tests -v
      - run: flutter pub get
      - run: nice -n 10 dart run build_runner build --build-filter lib/services/db/app_database.g.dart
      - run: nice -n 10 flutter analyze
      - run: nice -n 10 flutter test
      - run: nice -n 10 flutter build web --no-wasm-dry-run --no-pub

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: flutter pub get
      - run: nice -n 10 flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - run: flutter pub get
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Package simulator app
        run: tar -czf ios-simulator.tar.gz -C build/ios/iphonesimulator Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: ios-simulator.tar.gz
          if-no-files-found: error
