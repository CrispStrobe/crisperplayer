name: CrisperPlayerCompanions
options:
  bundleIdPrefix: com.crispstrobe.crisperplayer
settings:
  base:
    DEVELOPMENT_TEAM: N9XSJ4M3GT
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 16
    CODE_SIGN_STYLE: Manual
targets:
  PlayerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: '15.0'
    sources: [PlayerWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crispstrobe.crisperplayer.PlayerWidget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    entitlements:
      path: PlayerWidget/PlayerWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.crispstrobe.crisperplayer]
    info:
      path: PlayerWidget/Info.plist
      properties:
        CFBundleDisplayName: CrisperPlayer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: NO
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PlayerWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources: [PlayerWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crispstrobe.crisperplayer.watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: '4'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PlayerWatch/Info.plist
      properties:
        CFBundleDisplayName: CrisperPlayer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: NO
        WKApplication: YES
        WKCompanionAppBundleIdentifier: com.crispstrobe.crisperplayer
