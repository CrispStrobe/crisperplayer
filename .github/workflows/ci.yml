name: CI
on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true
      - run: flutter pub get
      - run: nice -n 10 dart run build_runner build --delete-conflicting-outputs
      - run: nice -n 10 flutter analyze
      - run: nice -n 10 flutter test
      - run: nice -n 10 flutter build web --no-wasm-dry-run --no-pub

  android:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: flutter pub get
      - run: nice -n 10 flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
