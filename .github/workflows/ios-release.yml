name: iOS Internal TestFlight

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign only; do not upload
        type: boolean
        default: true
      distribute_only:
        description: Retry internal distribution for the version already uploaded
        type: boolean
        default: false

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUNDLE_ID: com.crispstrobe.crisperplayer
  EXTENSION_BUNDLE_ID: com.crispstrobe.crisperplayer.ShareExtension
  APP_GROUP: group.com.crispstrobe.crisperplayer
  FLUTTER_VERSION: '3.44.4'

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_EXT_BASE64: ${{ secrets.IOS_PROFILE_EXT_BASE64 }}
        run: |
          set -euo pipefail
          for name in ASC_APP_ID ASC_KEY_ID ASC_ISSUER_ID ASC_TEAM_ID ASC_API_KEY_P8_BASE64 DIST_CERT_P12_BASE64 DIST_CERT_PASSWORD IOS_PROFILE_APP_BASE64 IOS_PROFILE_EXT_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret: $name"; exit 1; fi
          done
      - uses: subosito/flutter-action@v2
        if: ${{ !inputs.distribute_only }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve and verify code
        if: ${{ !inputs.distribute_only }}
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter pub get
          dart run build_runner build --build-filter lib/services/db/app_database.g.dart
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Import the existing distribution identity
        if: ${{ !inputs.distribute_only }}
        env:
          P12_B64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          signing_keychain="$RUNNER_TEMP/crisper-signing.keychain-db"
          signing_password="$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$signing_keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$signing_keychain" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$signing_keychain" > /dev/null
          security find-identity -v -p codesigning "$signing_keychain"
      - name: Install and validate both App Store profiles
        if: ${{ !inputs.distribute_only }}
        env:
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_EXT_BASE64: ${{ secrets.IOS_PROFILE_EXT_BASE64 }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: python3 scripts/ios_signing.py install
      - name: Archive unsigned and sign at export
        if: ${{ !inputs.distribute_only }}
        run: |
          set -euo pipefail
          PATH="/usr/bin:$PATH" flutter build ios --release --config-only --no-codesign --no-pub
          PATH="/usr/bin:$PATH" env -u GEM_HOME -u GEM_PATH -u RUBYOPT pod install --project-directory=ios
          # No automatic provisioning: never create or revoke account certificates.
          rm -rf build/ios/archive/Runner.xcarchive build/ios/ipa
          PATH="/usr/bin:$PATH" xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO SDK_STAT_CACHE_ENABLE=NO clean archive
          test -d build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          PATH="/usr/bin:$PATH" xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          python3 scripts/ios_signing.py restore-groups
          python3 scripts/ios_signing.py verify
      - name: Save signed IPA
        if: ${{ !inputs.distribute_only }}
        uses: actions/upload-artifact@v4
        with:
          name: crisperplayer-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Configure App Store Connect API access
        if: ${{ github.event_name == 'push' || !inputs.dry_run || inputs.distribute_only }}
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet cryptography
      - name: Upload this IPA to App Store Connect
        if: ${{ !inputs.distribute_only && (github.event_name == 'push' || !inputs.dry_run) }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_INTERNAL_TESTER_EMAIL: ${{ secrets.ASC_INTERNAL_TESTER_EMAIL }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/asc-venv/bin/python" scripts/ios_signing.py check-app
          xcrun altool --validate-app -f "$IPA" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-package "$IPA" --type ios --apple-id "$ASC_APP_ID" \
            --bundle-id "$BUNDLE_ID" --bundle-version "$BUNDLE_BUILD" --bundle-short-version-string "$BUNDLE_VERSION" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Wait for processing and deliver to internal TestFlight
        if: ${{ github.event_name == 'push' || !inputs.dry_run || inputs.distribute_only }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_INTERNAL_TESTER_EMAIL: ${{ secrets.ASC_INTERNAL_TESTER_EMAIL }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          number="$(sed -n 's/^version: .*+//p' pubspec.yaml)"
          "$RUNNER_TEMP/asc-venv/bin/python" scripts/testflight_internal.py --app-id "$ASC_APP_ID" \
            --bundle-id "$BUNDLE_ID" --version "$version" --build "$number" --notes docs/TESTFLIGHT_NOTES.txt --wait-minutes 40
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/crisper-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/host.mobileprovision" "$RUNNER_TEMP/extension.mobileprovision"
          rm -f "$HOME/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
