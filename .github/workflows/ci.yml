name: CI
on:
  push:
    branches: [master, main, develop]
    # Documentation edits must not cancel code checks or queue native binaries.
    paths-ignore: ['**/*.md', 'docs/**/*.txt']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Rust targets for the bundled SMB bridge
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - name: Check release automation
        run: |
          python3 -m venv "$RUNNER_TEMP/release-checks"
          "$RUNNER_TEMP/release-checks/bin/pip" install --quiet cryptography paramiko impacket
          "$RUNNER_TEMP/release-checks/bin/python" -m unittest discover -s scripts/tests -v
      - run: flutter pub get
      - name: In-app Rust SMB notice matches the pinned Cargo inventory
        run: python3 scripts/rust_smb_notice.py --check
      - name: Report distribution license blockers
        run: python3 scripts/check_distribution_licenses.py --report --platform all --output build/licensing/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-license-report
          path: build/licensing/report.json
          if-no-files-found: error
      - run: nice -n 10 dart run build_runner build --build-filter lib/services/db/app_database.g.dart
      - run: nice -n 10 flutter analyze
      - name: Unit and isolated SFTP/SMB tests
        env:
          CRISPER_SFTP_PYTHON: ${{ runner.temp }}/release-checks/bin/python
          CRISPER_SMB_PYTHON: ${{ runner.temp }}/release-checks/bin/python
        run: nice -n 10 flutter test test packages/crisper_audio/test
      - name: SMB mock-server tests with the Rust and Auto engines
        env:
          CRISPER_SMB_PYTHON: ${{ runner.temp }}/release-checks/bin/python
        run: |
          for engine in rust auto; do
            nice -n 10 flutter test --dart-define=CRISP_SMB_BACKEND=$engine test/smb_live_test.dart
          done
      - name: Compile CLI bundle
        run: |
          nice -n 10 dart build cli -o build/cli
          python3 scripts/package_cli_notices.py build/cli/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: crisperplayer-cli-linux
          path: build/cli/bundle
          if-no-files-found: error
      - run: nice -n 10 flutter build web --no-wasm-dry-run --no-pub

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  android:
    # Permanent binaries are built by release.yml on immutable version tags.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    # Keep tested binary builds alive when a newer commit starts its checks.
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
      - name: Rust targets for the bundled SMB bridge
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install the pinned native toolchain
        run: sdkmanager 'cmake;3.22.1' 'ndk;28.2.13676358'
      - run: flutter pub get
      - name: Record Android source evidence before preparing notices
        run: >-
          python3 scripts/check_distribution_licenses.py --report --platform android
          --output build/android-audio-evidence/source-license-report.json
      - name: Prepare exact installed-NDK runtime notices
        run: >-
          python3 scripts/audit_android_audio.py prepare-notices
          --ndk "$ANDROID_HOME/ndk/28.2.13676358"
          --output build/android-audio-evidence/ndk-notices.json
      # --no-pub skips Flutter's release-mode plugin registrant regeneration.
      - run: nice -n 10 flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - name: Verify the packaged Android audio libraries and notices
        run: >-
          python3 scripts/audit_android_audio.py inspect
          build/app/outputs/flutter-apk/app-release.apk
          --ndk "$ANDROID_HOME/ndk/28.2.13676358"
          --abi armeabi-v7a --abi arm64-v8a --abi x86_64
          --source-revision "$(git rev-parse HEAD)"
          --output build/android-audio-evidence/release-apk.json
      - name: Enable KVM for release startup test
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise release startup on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 scripts/android_release_smoke.py build/app/outputs/flutter-apk/app-release.apk
            adb uninstall com.crispstrobe.crisperplayer
            flutter test integration_test/browser_upload_test.dart -d emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-evidence
          path: build/android-smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-audio-artifact-evidence
          path: build/android-audio-evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    needs: test
    concurrency:
      group: ios-simulator-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Rust targets for the bundled SMB bridge
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - run: flutter pub get
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Exercise startup and browser uploads on iOS Simulator
        run: python3 scripts/ios_simulator_acceptance.py
      - name: Restore regular simulator app after integration tests
        run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Package simulator app
        run: tar -czf ios-simulator.tar.gz -C build/ios/iphonesimulator Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: ios-simulator.tar.gz
          if-no-files-found: error
