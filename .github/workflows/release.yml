name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag matching pubspec.yaml (for example v0.1.0+13)'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  FLUTTER_VERSION: '3.44.4'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate tag and version
        run: python scripts/release.py validate "$RELEASE_TAG"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 -m venv "$RUNNER_TEMP/checks"
          "$RUNNER_TEMP/checks/bin/pip" install --quiet cryptography paramiko impacket
          "$RUNNER_TEMP/checks/bin/python" -m unittest discover -s scripts/tests -v
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - name: Unit and isolated protocol tests
        env:
          CRISPER_SFTP_PYTHON: ${{ runner.temp }}/checks/bin/python
          CRISPER_SMB_PYTHON: ${{ runner.temp }}/checks/bin/python
        run: flutter test --no-pub
      - name: Browser player tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  android:
    runs-on: ubuntu-latest
    env:
      CRISPER_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      CRISPER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CRISPER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate tag and version
        run: python scripts/release.py validate "$RELEASE_TAG"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore dedicated Android release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          export CRISPER_ANDROID_KEYSTORE="$RUNNER_TEMP/crisper-release.p12"
          echo "CRISPER_ANDROID_KEYSTORE=$CRISPER_ANDROID_KEYSTORE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ['KEYSTORE_BASE64', 'CRISPER_ANDROID_STORE_PASSWORD', 'CRISPER_ANDROID_KEY_ALIAS', 'CRISPER_ANDROID_KEY_PASSWORD']:
              if not os.environ.get(name): raise SystemExit('Missing signing configuration: ' + name)
          path = Path(os.environ['CRISPER_ANDROID_KEYSTORE'])
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Verify and stage signed APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/CrisperPlayer-android.apk
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          tools = sorted((Path(os.environ['ANDROID_HOME']) / 'build-tools').iterdir(), key=lambda p: [int(x) for x in p.name.split('.') if x.isdigit()])[-1]
          result = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--print-certs', 'dist/CrisperPlayer-android.apk'], text=True)
          if 'Android Debug' in result: raise SystemExit('Refusing to release a debug-signed APK')
          Path('dist/ANDROID-SIGNING.txt').write_text(result)
          PY
      - name: Enable KVM for release APK startup test
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the signed release APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 scripts/android_release_smoke.py dist/CrisperPlayer-android.apk
            adb uninstall com.crispstrobe.crisperplayer
            flutter test integration_test/browser_upload_test.dart -d emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-release-startup-evidence
          path: build/android-smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            # permission_handler_windows still uses the experimental coroutine
            # headers rejected by the VS 2026 compiler on windows-latest.
            runner: windows-2022
            target: windows
            app: build/windows/x64/runner/Release
          - platform: linux-x64
            runner: ubuntu-24.04
            target: linux
            app: build/linux/x64/release/bundle
          - platform: macos-arm64
            runner: macos-15
            target: macos
            app: build/macos/Build/Products/Release/crisperplayer.app
            exclude_arch: x86_64
          - platform: macos-x64
            runner: macos-15-intel
            target: macos
            app: build/macos/Build/Products/Release/crisperplayer.app
            exclude_arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate tag and version
        run: python scripts/release.py validate "$RELEASE_TAG"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Linux build and runtime dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libmpv-dev libasound2-dev
      - name: Configure unsigned Mac archive for this architecture
        if: matrix.target == 'macos'
        env:
          EXCLUDE_ARCH: ${{ matrix.exclude_arch }}
        run: |
          cat > "$RUNNER_TEMP/Release.xcconfig" <<EOF
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          EXCLUDED_ARCHS = $EXCLUDE_ARCH
          EOF
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/Release.xcconfig" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release --dart-define=CRISPERPLAYER_CLI=true
      - name: Ad-hoc sign complete Mac app
        if: matrix.target == 'macos'
        run: |
          codesign --force --deep --sign - build/macos/Build/Products/Release/crisperplayer.app
          codesign --verify --deep --strict build/macos/Build/Products/Release/crisperplayer.app
      - name: Build CLI with native assets
        run: |
          dart build cli -o build/cli
          python scripts/package_cli_notices.py build/cli/bundle
          if [ -f build/cli/bundle/bin/crisperplayer.exe ]; then build/cli/bundle/bin/crisperplayer.exe --help; else build/cli/bundle/bin/crisperplayer --help; fi
      - name: Sign and notarize configured Mac releases
        if: matrix.target == 'macos'
        env:
          MAC_P12: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          MAC_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
          MAC_IDENTITY: ${{ secrets.MAC_DEVELOPER_ID_IDENTITY }}
          NOTARY_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MAC_P12$MAC_P12_PASSWORD$MAC_IDENTITY" ]; then
            echo "Developer ID not configured; this release is explicitly ad-hoc signed."
            exit 0
          fi
          test -n "$MAC_P12" && test -n "$MAC_P12_PASSWORD" && test -n "$MAC_IDENTITY"
          test -n "$NOTARY_KEY" && test -n "$NOTARY_KEY_ID" && test -n "$NOTARY_ISSUER"
          signing_keychain="$RUNNER_TEMP/brickwright-build.keychain-db"
          signing_password="$(uuidgen)"
          trap 'security delete-keychain "$signing_keychain"; rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"' EXIT
          umask 077
          echo "$MAC_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$signing_keychain" -P "$MAC_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$signing_keychain" > /dev/null
          python3 scripts/sign_desktop.py --app build/macos/Build/Products/Release/crisperplayer.app --cli build/cli/bundle --keychain "$signing_keychain" --identity "$MAC_IDENTITY" --notary-key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          echo "DESKTOP_SIGNATURE=Developer ID signed; Apple notarization accepted and app ticket stapled." >> "$GITHUB_ENV"
      - name: Authenticode sign configured Windows releases
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGN_PFX_BASE64 -and -not $env:WINDOWS_SIGN_PASSWORD) {
            Write-Host 'Windows signing certificate not configured; this release is explicitly unsigned.'
            exit 0
          }
          ./scripts/sign_windows.ps1 -App build/windows/x64/runner/Release -Cli build/cli/bundle
          "DESKTOP_SIGNATURE=Authenticode signed and verified with a trusted SHA-256 timestamp." >> $env:GITHUB_ENV
      - name: Package complete app and CLI
        run: python scripts/release.py package --tag "$RELEASE_TAG" --platform '${{ matrix.platform }}' --app '${{ matrix.app }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    concurrency:
      group: binary-release-publication
      cancel-in-progress: false
    needs: [verify, android, desktop]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: python3 scripts/release.py checksums dist
      - name: Publish only after verification and all native builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "CrisperPlayer $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          python3 scripts/release.py publish --tag "$RELEASE_TAG" --directory dist
