name: Shared SMB contract
on:
  push:
    paths: ['pubspec.yaml', 'pubspec.lock', 'test/smb_backend_contract_test.dart', 'test/progress_notifications_test.dart', 'test/smb_settings_test.dart', 'test/server_connection_ui_test.dart', 'lib/services/**', 'lib/widgets/server_connection_dialog.dart', 'lib/screens/sync_settings_screen.dart', 'bin/crisperplayer.dart', '.github/workflows/smb-storage.yml']
  pull_request:
    paths: ['pubspec.yaml', 'pubspec.lock', 'test/smb_backend_contract_test.dart', 'test/progress_notifications_test.dart', 'test/smb_settings_test.dart', 'test/server_connection_ui_test.dart', 'lib/services/**', 'lib/widgets/server_connection_dialog.dart', 'lib/screens/sync_settings_screen.dart', 'bin/crisperplayer.dart', '.github/workflows/smb-storage.yml']
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Rust targets for the bundled SMB bridge
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - run: flutter pub get
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter test test/smb_backend_contract_test.dart test/progress_notifications_test.dart test/smb_settings_test.dart test/server_connection_ui_test.dart test/remote_library_test.dart
      - run: python3 -m unittest discover -s scripts/tests -p test_distribution_licenses.py
      - name: Verify SMB source and native recipe evidence
        run: |
          python3 scripts/check_distribution_licenses.py --report --output smb-license-report.json
          python3 - <<'PYTHON'
          import json
          report = json.load(open('smb-license-report.json'))
          relevant = {'crisperplayer', 'crisp_storage', 'dart_smb2', 'pubspec.yaml', 'inventory', 'ownership'}
          failures = [f for f in report['findings'] if f['component'] in relevant]
          assert not failures, failures
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smb-license-evidence
          path: smb-license-report.json
