name: Apple audio backend

on:
  pull_request:
    paths:
      - 'packages/just_audio/**'
      - 'lib/services/audio/speed_processing.dart'
      - 'lib/main.dart'
      - 'test/apple_speed_processing_test.dart'
      - 'test/portable_speed_processing_test.dart'
      - 'macos/RunnerTests/**'
      - 'macos/Runner/*.entitlements'
      - 'ios/RunnerTests/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/apple-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 45
    concurrency:
      group: apple-audio-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Select the SDK required by device_info_plus
        # device_info_plus 13.3.0 requires Xcode >= 26.1.1. The macos-15
        # runner still defaults to 16.4; select its installed 26.2 explicitly.
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Compile the shared SwiftPM processor target
        run: |
          swift build --package-path packages/just_audio/native/crisper_dsp -c release
          swift package --package-path packages/just_audio/darwin/just_audio dump-package
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - run: flutter pub get
      - name: Check audio configuration transport and controls
        run: flutter test --no-pub test/apple_speed_processing_test.dart test/portable_speed_processing_test.dart test/speed_controls_test.dart
      - name: Compile the macOS AVFoundation backend
        run: flutter build macos --debug --no-pub
      - name: Check Apple defaults and portable PCM playback
        run: >-
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner
          -configuration Debug -destination 'platform=macOS'
          -only-testing:RunnerTests test CODE_SIGNING_ALLOWED=NO
      - name: Compile the iOS AVFoundation backend
        run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Exercise native processors on an iOS Simulator
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [device["udid"] for runtime, entries in devices.items()
                        if "iOS" in runtime for device in entries
                        if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          print(candidates[0])')
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -destination-timeout 120 -parallel-testing-enabled NO \
            -only-testing:RunnerTests test CODE_SIGNING_ALLOWED=NO
