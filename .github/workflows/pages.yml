name: GitHub Pages
on:
  push:
    branches: [master]
    paths: ['site/**', 'package.json', 'package-lock.json', 'playwright.config.js', 'tests/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Stage static browser app
        run: |
          mkdir -p build/pages
          cp -R site/. build/pages/
          touch build/pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
