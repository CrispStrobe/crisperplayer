name: crisperplayer
description: "CrisperPlayer — versatile cross-platform audiobook player (Flutter). Plays m4b/m4a/mp3/flac/ogg/wav/aac/opus/wma/aiff. Resume, auto/manual bookmarks, listening history. Android+iOS+Desktop."
publish_to: 'none'
version: 0.1.0+14

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & routing — same stack as CrisperWeaver
  flutter_riverpod: ^3.0.0
  go_router: ^17.3.0
  material_color_utilities: ">=0.8.0 <0.14.0"

  # Audio — proven in CrisperWeaver, extended for background
  just_audio: ^0.10.5
  audio_session: ^0.2.3
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: any
  media_kit_libs_linux: any
  audio_service: ^0.18.18

  # Storage — drift for library/history/bookmarks (robust, migratable)
  drift: ^2.28.1
  drift_flutter: ^0.2.6
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.8.3
  shared_preferences: ^2.2.2

  # Files & permissions
  file_picker: ">=11.0.2 <13.0.0"
  permission_handler: ^12.0.3
  device_info_plus: ^13.0.0
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2
  share_plus: ^13.0.0
  # Keep the CocoaPods integration used by the iOS host and share extension.
  receive_sharing_intent: ">=1.8.1 <1.9.0"

  # Utils
  uuid: ^4.3.3
  intl: ">=0.19.0 <0.21.0"
  crypto: ^3.0.3
  flutter_secure_storage: ^11.2.0
  xml: ^7.0.1
  dartssh2: ^4.1.0
  collection: ^1.19.1
  crisp_storage:
    git:
      url: https://github.com/CrispStrobe/CrispCloud
      ref: ac90899f8110dcb266d122208b3b3a879a257eee
      path: packages/crisp_storage
  just_waveform: ^0.0.7

dependency_overrides:
  # SMB native build hooks need these backwards-compatible annotations.
  # Flutter 3.44 pins 1.18.0; remove when the SDK permits 1.19.0.
  meta: 1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  drift_dev: ^2.28.2

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/app-icon-source.png
    - assets/licenses/
