name: Portable desktop audio

on:
  pull_request:
    paths:
      - 'packages/just_audio/native/**'
      - 'packages/just_audio_media_kit/**'
      - 'scripts/build_linux_audio.py'
      - 'scripts/build_windows_audio.py'
      - 'scripts/prepare_portable_mpv.py'
      - 'scripts/smoke_desktop_audio.py'
      - 'licensing/linux_audio_sources.json'
      - '.github/workflows/desktop-portable-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: portable-desktop-linux-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools and native output dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential meson ninja-build pkg-config nasm python3-jinja2
          libfreetype-dev libfribidi-dev libharfbuzz-dev libasound2-dev
          libpulse-dev libxxhash-dev libvulkan-dev
      - name: Build the pinned LGPL libmpv with all four portable engines
        run: python3 scripts/build_linux_audio.py --workspace build/portable-linux --jobs 2 --build
      - name: Preserve build and real PCM integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-desktop-linux-evidence
          path: build/portable-linux/compliance/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: portable-desktop-windows-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python-jinja
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-xxhash
            mingw-w64-ucrt-x86_64-vulkan-headers
      - name: Build private LGPL FFmpeg and portable libmpv for WASAPI
        run: python scripts/build_windows_audio.py --workspace build/portable-windows --jobs 2 --build
      - name: Preserve build and real PCM integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-desktop-windows-evidence
          path: build/portable-windows/compliance/
          if-no-files-found: error
